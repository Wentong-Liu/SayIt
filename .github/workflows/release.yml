name: Release DMG

# Push a tag like v1.0.0 (or trigger manually) → build Release → Developer ID codesign → package DMG → notarize + staple → create a GitHub Release with the DMG attached.
#
# Configure these Secrets under the repo Settings → Secrets and variables → Actions:
#   DEVELOPER_ID_CERT_P12  —— base64 of the Developer ID Application certificate (.p12):  base64 -i cert.p12 | pbcopy
#   CERT_PASSWORD          —— the export password of that .p12
#   AC_API_KEY_ID          —— App Store Connect API Key ID
#   AC_API_ISSUER_ID       —— App Store Connect API Issuer ID
#   AC_API_KEY_P8          —— base64 of the App Store Connect API private key (.p8): base64 -i AuthKey_XXX.p8 | pbcopy
# See docs/RELEASE.md for details.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # write permission is required to create the Release

env:
  SCHEME: SayIt
  APP: SayIt

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project (XcodeGen)
        run: |
          set -euo pipefail
          cp Local.xcconfig.example Local.xcconfig
          brew install xcodegen
          xcodegen generate

      - name: Import Developer ID certificate into a temporary keychain
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain"
          KC_PWD="$(uuidgen)"
          security create-keychain -p "$KC_PWD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PWD" "$KC"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PWD" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENT="$(security find-identity -v -p codesigning "$KC" | grep 'Developer ID Application' | head -1 | sed -E 's/^[^"]*"(.*)"$/\1/')"
          test -n "$IDENT"
          echo "SIGN_IDENTITY=$IDENT" >> "$GITHUB_ENV"
          echo "Signing identity: $IDENT"

      - name: Build Release (unsigned first)
        run: |
          set -euo pipefail
          xcodebuild -project SayIt.xcodeproj -scheme "$SCHEME" -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Codesign with Developer ID (hardened runtime)
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release/$APP.app"
          # --entitlements is REQUIRED: the unsigned xcodebuild (CODE_SIGNING_ALLOWED=NO) embeds none, and under the
          # hardened runtime (--options runtime) the app is denied microphone access without
          # com.apple.security.device.audio-input. App/SayIt.entitlements carries that (+ sandbox off, apple-events).
          codesign --force --deep --options runtime --timestamp \
            --entitlements App/SayIt.entitlements --sign "$SIGN_IDENTITY" "$APP_PATH"
          codesign --verify --strict --verbose=2 "$APP_PATH"
          # Sanity-check the entitlement actually made it into the binary, so a regression fails the build here.
          codesign -d --entitlements - "$APP_PATH" 2>/dev/null | grep -q "com.apple.security.device.audio-input"

      - name: Package DMG
        run: |
          set -euo pipefail
          brew install create-dmg
          APP_PATH="build/Build/Products/Release/$APP.app"
          create-dmg \
            --volname "$APP" \
            --window-size 540 360 --icon-size 110 \
            --icon "$APP.app" 150 180 --app-drop-link 390 180 \
            --no-internet-enable \
            "$APP.dmg" "$APP_PATH" || true   # create-dmg sometimes exits non-zero even on success; the next line confirms the artifact
          test -f "$APP.dmg"
          codesign --force --timestamp --sign "$SIGN_IDENTITY" "$APP.dmg"

      - name: Notarize and staple
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          echo "$AC_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/ac_key.p8"
          xcrun notarytool submit "$APP.dmg" \
            --key "$RUNNER_TEMP/ac_key.p8" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$APP.dmg"
          rm "$RUNNER_TEMP/ac_key.p8"

      - name: Upload build artifact (downloadable even on non-tag runs)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-dmg
          path: ${{ env.APP }}.dmg

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APP }}.dmg
          body: |
            SayIt —— macOS 菜单栏里的本地语音听写，配合你的 Codex 订阅润色。

            下载下方 `SayIt.dmg`，拖进「应用程序」即可。

            SayIt — local voice dictation in your macOS menu bar, polished with your Codex subscription. Download `SayIt.dmg` below and drag it into Applications.
