name: SayIt

options:
  bundleIdPrefix: com.liuwentong
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  # UI localization: development language is English. The String Catalogs
  # (Localizable/InfoPlist.xcstrings) ship en + zh-Hans; Xcode registers the
  # known regions from the catalogs at build time. See App/Info.plist for
  # CFBundleLocalizations.
  developmentLanguage: en

# Local, machine-specific signing config (gitignored). It supplies
# DEVELOPMENT_TEAM so the code-signing Team ID is never committed. Copy
# Local.xcconfig.example to Local.xcconfig and set your own team. See README.
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

packages:
  SayItCore:
    path: SayItCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  SayIt:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App
    dependencies:
      - package: SayItCore
    settings:
      base:
        PRODUCT_NAME: SayIt
        PRODUCT_BUNDLE_IDENTIFIER: com.liuwentong.SayIt
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/SayIt.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM comes from the gitignored Local.xcconfig (see configFiles).
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SayItTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: AppTests
    dependencies:
      - target: SayIt
      - package: SayItCore
    settings:
      base:
        PRODUCT_NAME: SayItTests
        PRODUCT_BUNDLE_IDENTIFIER: com.liuwentong.SayItTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM comes from the gitignored Local.xcconfig (see configFiles).
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"

schemes:
  SayIt:
    build:
      targets:
        SayIt: all
        SayItTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SayItTests
    archive:
      config: Release
