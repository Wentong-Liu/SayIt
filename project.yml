name: SayIt

options:
  bundleIdPrefix: com.liuwentong
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  # 界面本地化：开发语言英文。String Catalog（Localizable/InfoPlist.xcstrings）含 en + zh-Hans，
  # 已知区域由 Xcode 在构建期据目录自动登记，CFBundleLocalizations 见 App/Info.plist。
  developmentLanguage: en

packages:
  SayItCore:
    path: SayItCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  SayIt:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App
    dependencies:
      - package: SayItCore
    settings:
      base:
        PRODUCT_NAME: SayIt
        PRODUCT_BUNDLE_IDENTIFIER: com.liuwentong.SayIt
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/SayIt.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 95JJW8BPVA
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SayItTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: AppTests
    dependencies:
      - target: SayIt
      - package: SayItCore
    settings:
      base:
        PRODUCT_NAME: SayItTests
        PRODUCT_BUNDLE_IDENTIFIER: com.liuwentong.SayItTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 95JJW8BPVA
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"

schemes:
  SayIt:
    build:
      targets:
        SayIt: all
        SayItTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SayItTests
    archive:
      config: Release
